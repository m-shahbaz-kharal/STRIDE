[project]
name = "stride-web"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.24",
    "websockets>=12.0",
    "wsproto>=1.2.0",
    "numpy>=2.0.0",
    "opencv-python>=4.12.0.88",
    "supervision>=0.25.0",
    "ultralytics>=8.3.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.19",
    "bcrypt==4.0.1",
    "passlib[bcrypt]>=1.7.4",
    "python-jose>=3.3.0",
    "email-validator>=2.1.1",
    "scipy>=1.10",
    # Plugin packages (editable install from local packages/)
    "stride-core",
    "stride-sam3",
    "stride-fl511",
    "stride-ouster",
    "stride-people",
]

[tool.uv.sources]
stride-core = { path = "../packages/stride-core", editable = true }
stride-sam3 = { path = "../packages/stride-sam3", editable = true }
stride-fl511 = { path = "../packages/stride-fl511", editable = true }
stride-ouster = { path = "../packages/stride-ouster", editable = true }
stride-people = { path = "../packages/stride-people", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
