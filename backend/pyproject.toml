[project]
name = "liguard-web"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.24",
    "websockets>=12.0",
    "numpy>=2.0.0",
    "opencv-python>=4.12.0.88",
    "selenium>=4.38.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.19",
    "bcrypt==4.0.1",
    "passlib[bcrypt]>=1.7.4",
    "python-jose>=3.3.0",
    "email-validator>=2.1.1",
    # Plugin packages (editable install from local packages/)
    "liguard-core",
    "liguard-sam3",
    "liguard-fl511",
]

[tool.uv.sources]
liguard-core = { path = "../packages/liguard-core", editable = true }
liguard-sam3 = { path = "../packages/liguard-sam3", editable = true }
liguard-fl511 = { path = "../packages/liguard-fl511", editable = true }
