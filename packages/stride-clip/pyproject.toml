[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stride-clip"
version = "0.1.0"
description = "OpenAI CLIP zero-shot image classification node for STRIDE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "stride-core",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "transformers>=4.40",
    "torch>=2.0",
    "pillow>=10.0",
]

[project.entry-points."stride.plugins"]
clip = "stride_clip:register"

[tool.hatch.build.targets.wheel]
packages = ["src/stride_clip"]
