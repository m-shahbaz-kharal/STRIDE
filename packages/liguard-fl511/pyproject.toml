[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liguard-fl511"
version = "1.0.0"
description = "FL511 Camera integration for LiGuard-Web"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "LiGuard-Web Team" }
]
keywords = ["liguard", "fl511", "camera", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "liguard-core>=1.0.0,<2.0.0",
    "numpy>=1.26",
    "opencv-python>=4.8.0",
    "selenium>=4.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.entry-points."liguard.plugins"]
fl511 = "liguard_fl511:register"

[tool.hatch.build.targets.wheel]
packages = ["src/liguard_fl511"]
