[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stride-grounding-dino"
version = "0.1.0"
description = "Open-vocabulary detection with Grounding DINO for STRIDE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "stride-core",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "transformers>=4.40",
    "torch>=2.0",
    "pillow>=10.0",
]

[project.entry-points."stride.plugins"]
grounding_dino = "stride_grounding_dino:register"

[tool.hatch.build.targets.wheel]
packages = ["src/stride_grounding_dino"]
