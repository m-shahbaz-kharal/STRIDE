[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stride-people"
version = "0.1.0"
description = "People detection and occupancy tracking for STRIDE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "stride-core",
]

[project.entry-points."stride.plugins"]
people = "stride_people:register"

[tool.hatch.build.targets.wheel]
packages = ["src/stride_people"]
