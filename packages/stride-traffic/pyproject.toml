[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stride-traffic"
version = "0.1.0"
description = "Traffic / transportation engineering nodes for STRIDE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "stride-core",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.entry-points."stride.plugins"]
traffic = "stride_traffic:register"

[tool.hatch.build.targets.wheel]
packages = ["src/stride_traffic"]
