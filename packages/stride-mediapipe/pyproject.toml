[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stride-mediapipe"
version = "0.1.0"
description = "Google MediaPipe pose / hands / face landmark nodes for STRIDE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "stride-core",
    "numpy>=1.24",
    "opencv-python>=4.8",
    # mediapipe ships pre-built wheels for most platforms.
    "mediapipe>=0.10",
]

[project.entry-points."stride.plugins"]
mediapipe = "stride_mediapipe:register"

[tool.hatch.build.targets.wheel]
packages = ["src/stride_mediapipe"]
