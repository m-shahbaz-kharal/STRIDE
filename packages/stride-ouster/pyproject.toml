[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stride-ouster"
version = "1.0.0"
description = "Ouster LiDAR integration for STRIDE"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "STRIDE Team" }
]
keywords = ["stride", "ouster", "lidar", "pointcloud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "stride-core>=1.0.0,<2.0.0",
    "ouster-sdk>=0.13.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.entry-points."stride.plugins"]
ouster = "stride_ouster:register"

[tool.hatch.build.targets.wheel]
packages = ["src/stride_ouster"]
