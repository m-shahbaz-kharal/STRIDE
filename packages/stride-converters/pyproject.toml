[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stride-converters"
version = "0.1.0"
description = "Type-conversion graph nodes for STRIDE (the convert.* family)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "stride-core",
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.entry-points."stride.plugins"]
converters = "stride_converters:register"

[tool.hatch.build.targets.wheel]
packages = ["src/stride_converters"]
